databases:
  - name: cafe-database
    databaseName: cafedb
    user: cafeuser
    plan: free

services:
  # Backend API Web Service (Node / Express / Prisma)
  - type: web
    name: cafe-server
    runtime: node
    plan: free
    rootDir: server
    # db:seed is a no-op once the database has data (it used to truncate every
    # table on every deploy). db:repair-images repoints any rows still holding
    # a dead remote photo URL at the assets bundled with the client.
    buildCommand: npm install --include=dev && npm run build && npx prisma db push && npm run db:seed && npm run db:repair-images
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-database
          property: connectionString
      - key: CLIENT_URL
        value: https://cafe-client.onrender.com

  # Frontend Static Website (React / Vite)
  - type: web
    name: cafe-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cafe-server.onrender.com/api
      # Address encoded into the table QR codes. Must be the public site, not
      # whatever host the admin happens to have the console open on.
      - key: VITE_PUBLIC_URL
        value: https://cafe-client.onrender.com
