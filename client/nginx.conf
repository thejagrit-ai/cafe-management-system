server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API client issues same-origin requests to /api, so nginx forwards them
    # to the server container. Without this the SPA fallback below would answer
    # API calls with index.html.
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed JS/CSS into /assets/, so those are safe to
    # cache forever — the filename changes when the content does.
    location ~* ^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else under /assets/ comes from public/ and keeps a stable
    # filename: product photos, category images, the hero video. Marking those
    # immutable would mean replacing a product photo never reaches anyone who
    # had already loaded the old one.
    location ~* ^/assets/.+\.(jpg|jpeg|png|gif|webp|avif|svg|mp4|webm|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Client-side routing: unknown paths must return the SPA shell, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
