services:
  postgres:
    image: postgres:16-alpine
    container_name: cafe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cafe_management}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The server runs migrations on boot, so it must not start until Postgres
    # is actually accepting connections rather than merely created.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cafe_management}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      # Root context: the workspace root package.json/lockfile/tsconfig are
      # required to install and compile the server workspace.
      context: .
      dockerfile: ./server/Dockerfile
    container_name: cafe-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cafe_management}?schema=public
      # No default: compose fails fast rather than shipping a known secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
    container_name: cafe-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
