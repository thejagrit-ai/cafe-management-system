# Single-service deploy: one Render web service builds the React client and
# runs the Express API, serving both from the same URL.
#
# The database below is the one that already exists in this workspace. Render
# matches blueprint resources by name, so this block adopts it rather than
# creating a second instance — and, critically, keeps it under blueprint
# management. Deleting this block does not free up anything; it only orphans a
# live database from the blueprint that owns it.

databases:
  - name: cafe-database
    databaseName: cafedb
    user: cafeuser
    plan: free
    region: oregon

services:
  - type: web
    name: cafe-server
    runtime: node
    plan: free
    # Must match the database's region, or the Internal Database URL will not
    # resolve. Check it on the database page in the Render dashboard.
    region: oregon
    # Build from the repo root so both client/ and server/ are accessible.
    # 1. Install root-level workspace deps (pulls in client + server).
    # 2. Build the React client (outputs to client/dist).
    # 3. Build the Express server (outputs to server/dist).
    # 4. Push the Prisma schema & seed.
    buildCommand: >-
      npm install --include=dev &&
      npm run build:client &&
      npm run build:server &&
      test -f client/dist/index.html &&
      cd server && npx prisma db push && npm run db:seed && npm run db:repair-images
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Resolves to the database's internal connection string: free, fast, and
      # never leaves Render's network. Both resources are pinned to Oregon
      # because an internal URL is unreachable from another region.
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-database
          property: connectionString
      # Must be the service's full public URL, e.g.
      # https://cafe-server-xxxx.onrender.com — it is what email verification
      # links are built from, so a bare hostname yields unclickable mail.
      #
      # Deliberately NOT `fromService … property: host`: that resolves to the
      # single-label internal host (`cafe-server-xxxx`, no domain), which is
      # unreachable from the public internet. Render exposes no blueprint
      # property for a service's external URL, so this is prompted on apply.
      - key: CLIENT_URL
        sync: false
      # VITE_API_URL and VITE_PUBLIC_URL are intentionally unset. On a
      # single-service deploy the client is served from the same origin as the
      # API, so it correctly falls back to `/api` for requests and to
      # `window.location.origin` for the table QR codes. Setting either one
      # can only introduce a wrong value.
