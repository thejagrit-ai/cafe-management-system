databases:
  - name: cafe-database
    databaseName: cafedb
    user: cafeuser
    plan: free

services:
  # Single web service: the Express server builds and serves the React client.
  # The client bundle is compiled first, then the API, so the server can serve
  # the SPA from ../client/dist at runtime.
  - type: web
    name: cafe-server
    runtime: node
    plan: free
    # Build from the repo root so both client/ and server/ are accessible.
    # 1. Install root-level workspace deps (pulls in client + server).
    # 2. Build the React client (outputs to client/dist).
    # 3. Build the Express server (outputs to server/dist).
    # 4. Push the Prisma schema & seed.
    buildCommand: >-
      npm install --include=dev &&
      npm run build:client &&
      npm run build:server &&
      test -f client/dist/index.html &&
      cd server && npx prisma db push && npm run db:seed && npm run db:repair-images
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-database
          property: connectionString
      - key: CLIENT_URL
        value: https://client-psi-six-59.vercel.app
      # Not needed for single-service (API is on the same origin), but
      # listed for clarity. The client falls back to /api when unset.
      # - key: VITE_API_URL
      #   value: /api
      # Public URL baked into the QR codes generated in Admin → Tables.
      - key: VITE_PUBLIC_URL
        value: https://client-psi-six-59.vercel.app
