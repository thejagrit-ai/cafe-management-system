databases:
  - name: cafe-database
    databaseName: cafedb
    user: cafeuser
    plan: free

services:
  # Backend API Web Service (Node / Express / Prisma)
  - type: web
    name: cafe-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma db push && npm run db:seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cafe-database
          property: connectionString
      - key: CLIENT_URL
        value: https://cafe-client.onrender.com

  # Frontend Static Website (React / Vite)
  - type: web
    name: cafe-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://cafe-server.onrender.com/api
