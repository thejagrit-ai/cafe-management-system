# Single-service deploy: one Render web service builds the React client and
# runs the Express API, serving both from the same URL.
#
# The Postgres database already exists in this Render workspace, so it is NOT
# declared here — the free plan allows only one free Postgres per workspace and
# a blueprint that tried to create a second would fail the apply. DATABASE_URL
# is marked `sync: false`, so Render prompts for it when the blueprint is
# applied: paste the database's **Internal Database URL** from its dashboard
# page (internal, not external — it is free, faster, and never leaves Render's
# network).

services:
  - type: web
    name: cafe-server
    runtime: node
    plan: free
    # Must match the database's region, or the Internal Database URL will not
    # resolve. Check it on the database page in the Render dashboard.
    region: oregon
    # Build from the repo root so both client/ and server/ are accessible.
    # 1. Install root-level workspace deps (pulls in client + server).
    # 2. Build the React client (outputs to client/dist).
    # 3. Build the Express server (outputs to server/dist).
    # 4. Push the Prisma schema & seed.
    buildCommand: >-
      npm install --include=dev &&
      npm run build:client &&
      npm run build:server &&
      test -f client/dist/index.html &&
      cd server && npx prisma db push && npm run db:seed && npm run db:repair-images
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Prompted on blueprint apply — paste the Internal Database URL of the
      # Postgres instance you already have.
      - key: DATABASE_URL
        sync: false
      # Single-service deploy: the site and the API share this service's own
      # origin. Hard-coding a separate frontend host here is what broke the
      # last deploy — the URL it named no longer existed.
      - key: CLIENT_URL
        fromService:
          type: web
          name: cafe-server
          property: host
      # Not needed for single-service (API is on the same origin), but
      # listed for clarity. The client falls back to /api when unset.
      # - key: VITE_API_URL
      #   value: /api
      # Public URL baked into the QR codes generated in Admin → Tables.
      - key: VITE_PUBLIC_URL
        fromService:
          type: web
          name: cafe-server
          property: host
